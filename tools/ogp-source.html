<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:NS;font-weight:400;src:url(../fonts/noto-sans-jp-400.woff2)}
@font-face{font-family:NS;font-weight:500;src:url(../fonts/noto-sans-jp-500.woff2)}
@font-face{font-family:NS;font-weight:700;src:url(../fonts/noto-sans-jp-700.woff2)}
@font-face{font-family:JB;font-weight:500;src:url(../fonts/jetbrains-mono-500.woff2)}
*{margin:0;padding:0;box-sizing:border-box}
body{width:1200px;height:630px;font-family:NS,sans-serif;overflow:hidden}
.card{position:relative;width:1200px;height:630px;overflow:hidden}
/* kenma */
.k{background:#F4F2ED;color:#0E0E10}
.k .photo{position:absolute;right:0;top:0;width:500px;height:630px;background:url(../images/work-05.jpg) center/cover}
.k .photo::before{content:'';position:absolute;inset:0;background:linear-gradient(90deg,#F4F2ED 0%,rgba(244,242,237,.0) 22%)}
.k .body{position:absolute;left:72px;top:86px;width:700px}
.k .brand{display:flex;align-items:center;gap:16px;margin-bottom:54px}
.k .mark{width:60px;height:60px;border-radius:50%;background:#0E0E10;color:#F4F2ED;display:grid;place-items:center;font-weight:700;font-size:30px}
.k .bname{font-size:30px;font-weight:700;letter-spacing:.04em}
.k .bsub{font-size:15px;color:#4A4A47;letter-spacing:.2em;margin-top:2px}
.k h1{font-size:58px;font-weight:700;line-height:1.25;letter-spacing:.01em;margin-bottom:30px}
.k h1 em{font-style:normal;color:#1B3A6B}
.k .chips{display:flex;gap:10px;margin-bottom:34px}
.k .chip{font-size:20px;font-weight:500;color:#1B3A6B;border:1.5px solid rgba(27,58,107,.45);background:rgba(255,255,255,.7);padding:6px 16px;border-radius:3px}
.k .foot{font-size:21px;color:#26262B;font-weight:500}
.k .url{position:absolute;left:72px;bottom:40px;font-family:JB,monospace;font-size:18px;color:#5E5E65;letter-spacing:.06em}
.k .foot b{color:#1B3A6B}
.k .bar{position:absolute;left:0;bottom:0;width:700px;height:10px;background:#1B3A6B}
.k .seal{position:absolute;left:1030px;top:470px;width:118px;height:118px;border-radius:50%;background:#1B3A6B;color:#F4F2ED;display:grid;place-items:center;text-align:center;font-size:15px;line-height:1.45;font-weight:500;box-shadow:0 20px 40px -12px rgba(27,58,107,.5);transform:rotate(-8deg)}
.k .seal b{display:block;font-size:26px;font-weight:700}
/* studio */
.s{background:#fff;color:#0E0E10}
.s::before{content:'';position:absolute;right:-160px;top:-200px;width:720px;height:720px;border-radius:50%;background:radial-gradient(circle,#FFF1A6 0%,rgba(255,241,166,0) 68%)}
.s .dots{position:absolute;right:70px;bottom:70px;width:330px;height:210px;background-image:radial-gradient(#C9D2DF 2px,transparent 2px);background-size:22px 22px;opacity:.75}
.s .body{position:absolute;left:80px;top:74px;width:1000px}
.s .logo{display:flex;align-items:center;gap:22px;margin-bottom:58px}
.s .smark{position:relative;width:92px;height:92px;border-radius:20px;background:#1B3A6B;color:#fff;display:grid;place-items:center;font-size:48px;font-weight:700}
.s .smark::after{content:'';position:absolute;right:-6px;top:-6px;width:26px;height:26px;border-radius:50%;background:#F5DE00;border:4px solid #fff}
.s .sname{font-size:50px;font-weight:700;letter-spacing:.04em;line-height:1.1}
.s .sby{font-size:20px;color:#5E5E65;letter-spacing:.14em;margin-top:6px}
.s .label{display:inline-block;font-size:22px;font-weight:700;color:#1B3A6B;background:#FFF1A6;padding:6px 16px;border-radius:999px;margin-bottom:22px}
.s h1{font-size:60px;font-weight:700;line-height:1.3;margin-bottom:34px}
.s .chips{display:flex;gap:12px}
.s .chip{font-size:21px;font-weight:500;color:#1B3A6B;border:1.5px solid #D5DBE3;background:#fff;padding:7px 18px;border-radius:999px}
.s .url{position:absolute;left:80px;bottom:44px;font-family:JB,monospace;font-size:18px;color:#5E5E65;letter-spacing:.06em}
.s .bar{position:absolute;left:0;top:0;width:12px;height:630px;background:#F5DE00}
</style></head><body>
<div class="card k" id="kenma">
  <div class="photo"></div>
  <div class="seal"><div><b>松</b>職人の<br>手作業</div></div>
  <div class="body">
    <div class="brand"><div class="mark">松</div><div><div class="bname">株式会社松本研磨工業</div><div class="bsub">神奈川県川崎市の金属研磨</div></div></div>
    <h1>創業58年。<br>磨き続けた<em>信頼</em>と技術。</h1>
    <div class="chips"><span class="chip">バフ研磨</span><span class="chip">ベルト研磨</span><span class="chip">ヘアライン仕上げ</span><span class="chip">フレキ研磨</span></div>
    <div class="foot">図面なしでも見積もり<b>｜</b>1個から対応<b>｜</b>全国から受付</div>
  </div>
  <div class="url">matsumoto-kenma.co.jp</div>
  <div class="bar"></div>
</div>
<div class="card s" id="studio">
  <div class="bar"></div><div class="dots"></div>
  <div class="body">
    <div class="logo"><div class="smark">松</div><div><div class="sname">マツケンスタジオ</div><div class="sby">by 松本研磨工業</div></div></div>
    <div class="label">Web集客・AI活用支援</div>
    <h1>いい仕事をしている会社の<br>「知ってもらう」を、手伝います。</h1>
    <div class="chips"><span class="chip">サイト制作</span><span class="chip">SEO・LLMO</span><span class="chip">Web広告</span><span class="chip">AI活用</span></div>
  </div>
  <div class="url">matsumoto-kenma.co.jp/web-ai/</div>
</div>
</body></html>
